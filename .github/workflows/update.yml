# Rebuilds feed.json twice a day (about 06:00 and 18:00 in Nepal) and publishes it
# with GitHub Pages at https://saphalism007.github.io/saphal-econ-feed/feed.json
name: Update feed
on:
  schedule:
    - cron: "15 0,12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.mjs", ".github/workflows/update.yml"]
permissions:
  contents: write
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build feed.json
        run: node build.mjs
      - name: Publish if anything changed
        run: |
          git config user.name "saphal-econ-feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
